name: Integration

on:
  push:
    branches: [main]

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            native_name: libngspice.so
            ngspice_build_script: gradle/native-build/build-ngspice-linux.sh
          - os: windows-latest
            platform: windows-x86_64
            native_name: ngspice.dll
            ngspice_build_script: gradle/native-build/build-ngspice-windows.sh
          - os: macos-latest
            platform: macos-aarch64
            native_name: libngspice.dylib
            ngspice_build_script: gradle/native-build/build-ngspice-macos.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex libtool automake autoconf pkg-config
      - name: Install Windows native build dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-libtool
            mingw-w64-x86_64-pkg-config
            autoconf
            automake
            bison
            flex
            curl
      - name: Install macOS native build dependencies
        if: runner.os == 'macOS'
        run: brew install automake autoconf libtool bison flex pkg-config
      - name: Cache ngspice
        uses: actions/cache@v4
        with:
          path: |
            /opt/ngspice
            /opt/ngspice-win
            /opt/ngspice-mac
          key: ngspice-${{ runner.os }}-${{ hashFiles('gradle.properties', matrix.ngspice_build_script) }}
      - name: Build Linux ngspice shared library
        if: runner.os == 'Linux'
        run: |
          source ./gradle.properties
          sudo env \
            NGSPICE_VERSION="$ngspiceVersion" \
            NGSPICE_SOURCE_URL="$ngspiceSourceUrl" \
            NGSPICE_SHA256="$ngspiceSha256" \
            ./gradle/native-build/build-ngspice-linux.sh
      - name: Build Windows ngspice shared library
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          source ./gradle.properties
          NGSPICE_VERSION="$ngspiceVersion" \
          NGSPICE_SOURCE_URL="$ngspiceSourceUrl" \
          NGSPICE_SHA256="$ngspiceSha256" \
          ./gradle/native-build/build-ngspice-windows.sh
      - name: Build macOS ngspice shared library
        if: runner.os == 'macOS'
        run: |
          source ./gradle.properties
          sudo env \
            NGSPICE_VERSION="$ngspiceVersion" \
            NGSPICE_SOURCE_URL="$ngspiceSourceUrl" \
            NGSPICE_SHA256="$ngspiceSha256" \
            ./gradle/native-build/build-ngspice-macos.sh
      - name: Package Linux/macOS native library resource
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "bluespice-ngspice/build/native-resources/natives/${{ matrix.platform }}"
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            cp /opt/ngspice/lib/libngspice.so "bluespice-ngspice/build/native-resources/natives/${{ matrix.platform }}/${{ matrix.native_name }}"
            echo "NATIVE_LIB_DIR=/opt/ngspice/lib" >> "$GITHUB_ENV"
          else
            cp /opt/ngspice-mac/lib/libngspice.dylib "bluespice-ngspice/build/native-resources/natives/${{ matrix.platform }}/${{ matrix.native_name }}"
            echo "NATIVE_LIB_DIR=/opt/ngspice-mac/lib" >> "$GITHUB_ENV"
          fi
          echo "NATIVE_RESOURCE=bluespice-ngspice/build/native-resources/natives/${{ matrix.platform }}/${{ matrix.native_name }}" >> "$GITHUB_ENV"
      - name: Package Windows native library resource
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p "bluespice-ngspice/build/native-resources/natives/${{ matrix.platform }}"
          # MinGW names the output libngspice-0.dll; package the name BlueSpice loads.
          cp /opt/ngspice-win/bin/libngspice-0.dll /opt/ngspice-win/bin/ngspice.dll
          cp /opt/ngspice-win/bin/ngspice.dll "bluespice-ngspice/build/native-resources/natives/${{ matrix.platform }}/${{ matrix.native_name }}"
          echo "NATIVE_LIB_DIR=$(cygpath -w /opt/ngspice-win/bin)" >> "$GITHUB_ENV"
          echo "NATIVE_RESOURCE=bluespice-ngspice/build/native-resources/natives/${{ matrix.platform }}/${{ matrix.native_name }}" >> "$GITHUB_ENV"
      - name: Run integration tests on Linux
        if: runner.os == 'Linux'
        run: ./gradlew test -Ptags=intg -Djna.library.path="${{ env.NATIVE_LIB_DIR }}" -Djava.library.path="${{ env.NATIVE_LIB_DIR }}"
      - name: Run integration tests on macOS
        if: runner.os == 'macOS'
        run: ./gradlew test -Ptags=intg -x :bluespice-examples:test -Djna.library.path="${{ env.NATIVE_LIB_DIR }}" -Djava.library.path="${{ env.NATIVE_LIB_DIR }}"
      - name: Run integration tests on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat test -Ptags=intg -x :bluespice-examples:test "-Djna.library.path=${{ env.NATIVE_LIB_DIR }}" "-Djava.library.path=${{ env.NATIVE_LIB_DIR }}"
      - name: Upload integration test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports-${{ runner.os }}-${{ runner.arch }}
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: ${{ env.NATIVE_RESOURCE }}

  package:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts
      - name: Stage native libraries for Gradle
        run: |
          mkdir -p bluespice-ngspice/build/native-resources/natives/linux-x86_64
          mkdir -p bluespice-ngspice/build/native-resources/natives/windows-x86_64
          mkdir -p bluespice-ngspice/build/native-resources/natives/macos-aarch64

          cp native-artifacts/native-linux-x86_64/libngspice.so bluespice-ngspice/build/native-resources/natives/linux-x86_64/libngspice.so
          cp native-artifacts/native-windows-x86_64/ngspice.dll bluespice-ngspice/build/native-resources/natives/windows-x86_64/ngspice.dll
          cp native-artifacts/native-macos-aarch64/libngspice.dylib bluespice-ngspice/build/native-resources/natives/macos-aarch64/libngspice.dylib
      - name: Assemble native fat JAR
        run: ./gradlew :bluespice-ngspice:allJar
      - name: Upload fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: bluespice-ngspice-all
          path: bluespice-ngspice/build/libs/*-all.jar
