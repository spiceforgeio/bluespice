name: Integration

on:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex libtool automake autoconf pkg-config
      - name: Cache ngspice
        uses: actions/cache@v4
        with:
          path: /opt/ngspice
          key: ngspice-${{ runner.os }}-${{ hashFiles('gradle.properties', 'gradle/native-build/build-ngspice-linux.sh') }}
      - name: Build ngspice shared library
        run: |
          source ./gradle.properties
          sudo env \
            NGSPICE_VERSION="$ngspiceVersion" \
            NGSPICE_SOURCE_URL="$ngspiceSourceUrl" \
            NGSPICE_SHA256="$ngspiceSha256" \
            ./gradle/native-build/build-ngspice-linux.sh
      - name: Package Linux native library resource
        run: |
          mkdir -p bluespice-ngspice/src/main/resources/natives/linux-x86_64
          cp /opt/ngspice/lib/libngspice.so bluespice-ngspice/src/main/resources/natives/linux-x86_64/libngspice.so
      - run: ./gradlew test -Ptags=intg -Djna.library.path=/opt/ngspice/lib -Djava.library.path=/opt/ngspice/lib
