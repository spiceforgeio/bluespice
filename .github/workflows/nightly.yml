name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Restore Linux ngspice cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/ngspice
            /opt/ngspice-win
            /opt/ngspice-mac
          key: ngspice-Linux-${{ hashFiles('gradle.properties', 'gradle/native-build/build-ngspice-*.sh') }}
          fail-on-cache-miss: true
      - name: Verify cached ngspice
        run: |
          test -x /opt/ngspice/bin/ngspice
          test -f /opt/ngspice/lib/libngspice.so
          /opt/ngspice/bin/ngspice --version
      - name: Run oracle tests
        run: |
          export PATH="/opt/ngspice/bin:$PATH"
          ./gradlew test -Ptags=oracle -Djna.library.path=/opt/ngspice/lib -Djava.library.path=/opt/ngspice/lib
      - name: Upload oracle test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-results
          path: |
            **/build/reports/tests/
            **/build/test-results/test/

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Restore Linux ngspice cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/ngspice
            /opt/ngspice-win
            /opt/ngspice-mac
          key: ngspice-Linux-${{ hashFiles('gradle.properties', 'gradle/native-build/build-ngspice-*.sh') }}
          fail-on-cache-miss: true
      - name: Verify cached ngspice
        run: |
          test -x /opt/ngspice/bin/ngspice
          test -f /opt/ngspice/lib/libngspice.so
          /opt/ngspice/bin/ngspice --version
      - name: Run JMH benchmarks
        run: ./gradlew jmh -Djna.library.path=/opt/ngspice/lib -Djava.library.path=/opt/ngspice/lib
      - name: Upload JMH results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results-${{ github.sha }}
          path: bluespice-benchmarks/build/results/jmh/
      - name: Compare with baseline
        continue-on-error: true
        run: ./scripts/check-benchmark-regression.sh
