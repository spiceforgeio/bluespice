name: Oracle

on:
  workflow_dispatch:

jobs:
  oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex libtool automake autoconf pkg-config
      - name: Cache ngspice
        uses: actions/cache@v4
        with:
          path: /opt/ngspice
          key: oracle-ngspice-linux-x86_64-${{ hashFiles('gradle.properties', 'gradle/native-build/build-ngspice-linux.sh') }}
      - name: Build ngspice shared library
        run: |
          source ./gradle.properties
          sudo env \
            NGSPICE_VERSION="$ngspiceVersion" \
            NGSPICE_SOURCE_URL="$ngspiceSourceUrl" \
            NGSPICE_SHA256="$ngspiceSha256" \
            ./gradle/native-build/build-ngspice-linux.sh
      - name: Verify ngspice
        run: |
          test -x /opt/ngspice/bin/ngspice
          test -f /opt/ngspice/lib/libngspice.so
          /opt/ngspice/bin/ngspice --version
      - name: Run oracle tests
        run: |
          export PATH="/opt/ngspice/bin:$PATH"
          ./gradlew test -Ptags=oracle -Djna.library.path=/opt/ngspice/lib -Djava.library.path=/opt/ngspice/lib
      - name: Upload oracle test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-results
          path: |
            **/build/reports/tests/
            **/build/test-results/test/
