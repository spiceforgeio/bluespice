name: Publish Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Snapshot artifacts published here are pure-Java. Native-bundled releases
      # go to Maven Central via release.yml.
      - name: Document native artifact mode
        run: |
          echo "GitHub Packages publishes the Maven snapshot artifacts from this checkout."
          echo "Native-bundled releases are published to Maven Central by release.yml."
      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish
