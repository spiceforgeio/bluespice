name: Publish Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Snapshot artifacts published here are pure Java. Native classifier and
      # all-platform artifacts are release-only and require staged ngspice builds.
      - name: Document native artifact mode
        run: |
          echo "GitHub Packages publishes pure-Java snapshot artifacts from this checkout."
          echo "Native classifier and all-platform artifacts are published by release.yml."
      - name: Read project version
        id: version
        shell: bash
        run: |
          source gradle.properties
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish to GitHub Packages
        if: endsWith(steps.version.outputs.version, '-SNAPSHOT')
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish
