name: Publish Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Snapshot publishes are headless (no embedded native libraries).
      # Native libraries are assembled by the `package` job in integration.yml and
      # are available as workflow artifacts. Full native packaging is handled in
      # Phase 11 (Maven Central release workflow).
      - name: Document native artifact mode
        run: |
          echo "GitHub Packages publishes the Maven snapshot artifacts from this checkout."
          echo "The multi-platform native fat JAR is assembled by the Integration workflow package job and uploaded as a workflow artifact."
      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish
