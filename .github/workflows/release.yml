name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            ngspice_build_script: gradle/native-build/build-ngspice-linux.sh
            native_source: /opt/ngspice/lib/libngspice.so
            native_name: libngspice.so
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            ngspice_build_script: gradle/native-build/build-ngspice-linux.sh
            native_source: /opt/ngspice/lib/libngspice.so
            native_name: libngspice.so
          - platform: windows-x86_64
            os: windows-latest
            ngspice_build_script: gradle/native-build/build-ngspice-windows.sh
            native_source: /opt/ngspice-win/bin/ngspice.dll
            native_name: ngspice.dll
          - platform: macos-x86_64
            os: macos-15-intel
            ngspice_build_script: gradle/native-build/build-ngspice-macos.sh
            native_source: /opt/ngspice-mac/lib/libngspice.dylib
            native_name: libngspice.dylib
          - platform: macos-aarch64
            os: macos-latest
            ngspice_build_script: gradle/native-build/build-ngspice-macos.sh
            native_source: /opt/ngspice-mac/lib/libngspice.dylib
            native_name: libngspice.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex libtool automake autoconf pkg-config
      - name: Install Windows native build dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-libtool
            mingw-w64-x86_64-pkg-config
            autoconf
            automake
            bison
            flex
            curl
      - name: Install macOS native build dependencies
        if: runner.os == 'macOS'
        run: brew install automake autoconf libtool bison flex pkg-config
      - name: Cache ngspice
        uses: actions/cache@v4
        with:
          path: |
            /opt/ngspice
            /opt/ngspice-win
            /opt/ngspice-mac
          key: release-ngspice-${{ matrix.platform }}-${{ hashFiles('gradle.properties', matrix.ngspice_build_script) }}
      - name: Build Linux ngspice shared library
        if: runner.os == 'Linux'
        run: |
          source ./gradle.properties
          sudo env \
            NGSPICE_VERSION="$ngspiceVersion" \
            NGSPICE_SOURCE_URL="$ngspiceSourceUrl" \
            NGSPICE_SHA256="$ngspiceSha256" \
            ./gradle/native-build/build-ngspice-linux.sh
      - name: Build Windows ngspice shared library
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          source ./gradle.properties
          NGSPICE_VERSION="$ngspiceVersion" \
          NGSPICE_SOURCE_URL="$ngspiceSourceUrl" \
          NGSPICE_SHA256="$ngspiceSha256" \
          ./gradle/native-build/build-ngspice-windows.sh
          cp /opt/ngspice-win/bin/libngspice-0.dll /opt/ngspice-win/bin/ngspice.dll
      - name: Build macOS ngspice shared library
        if: runner.os == 'macOS'
        run: |
          source ./gradle.properties
          sudo env \
            NGSPICE_VERSION="$ngspiceVersion" \
            NGSPICE_SOURCE_URL="$ngspiceSourceUrl" \
            NGSPICE_SHA256="$ngspiceSha256" \
            ./gradle/native-build/build-ngspice-macos.sh
      - name: Stage Linux/macOS native library artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "native-${{ matrix.platform }}"
          cp "${{ matrix.native_source }}" "native-${{ matrix.platform }}/${{ matrix.native_name }}"
      - name: Stage Windows native library artifact
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p "native-${{ matrix.platform }}"
          cp "${{ matrix.native_source }}" "native-${{ matrix.platform }}/${{ matrix.native_name }}"
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native-${{ matrix.platform }}/${{ matrix.native_name }}

  publish:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts
      - name: Stage native libraries for Gradle
        run: |
          mkdir -p bluespice-ngspice/build/native-resources/natives/linux-x86_64
          mkdir -p bluespice-ngspice/build/native-resources/natives/linux-aarch64
          mkdir -p bluespice-ngspice/build/native-resources/natives/windows-x86_64
          mkdir -p bluespice-ngspice/build/native-resources/natives/macos-x86_64
          mkdir -p bluespice-ngspice/build/native-resources/natives/macos-aarch64

          cp native-artifacts/native-linux-x86_64/libngspice.so bluespice-ngspice/build/native-resources/natives/linux-x86_64/libngspice.so
          cp native-artifacts/native-linux-aarch64/libngspice.so bluespice-ngspice/build/native-resources/natives/linux-aarch64/libngspice.so
          cp native-artifacts/native-windows-x86_64/ngspice.dll bluespice-ngspice/build/native-resources/natives/windows-x86_64/ngspice.dll
          cp native-artifacts/native-macos-x86_64/libngspice.dylib bluespice-ngspice/build/native-resources/natives/macos-x86_64/libngspice.dylib
          cp native-artifacts/native-macos-aarch64/libngspice.dylib bluespice-ngspice/build/native-resources/natives/macos-aarch64/libngspice.dylib
      - name: Run unit tests
        run: ./gradlew test -Ptags=unit
      - name: Build and verify Maven artifacts
        shell: bash
        run: |
          ./gradlew \
            :bluespice-ngspice:jar \
            :bluespice-ngspice:allJar \
            :bluespice-ngspice:nativeLinux_x86_64Jar \
            :bluespice-ngspice:nativeLinux_aarch64Jar \
            :bluespice-ngspice:nativeWindows_x86_64Jar \
            :bluespice-ngspice:nativeMacos_x86_64Jar \
            :bluespice-ngspice:nativeMacos_aarch64Jar \
            -PpublishNativeArtifacts=true

          source gradle.properties
          jar_dir="bluespice-ngspice/build/libs"
          plain_jar="${jar_dir}/bluespice-ngspice-${version}.jar"
          all_jar="${jar_dir}/bluespice-ngspice-${version}-all.jar"

          if jar tf "${plain_jar}" | grep -q '^natives/'; then
            echo "Standard bluespice-ngspice JAR must not contain native libraries"
            exit 1
          fi

          check_entry() {
            local jar_file="$1"
            local entry="$2"
            if ! jar tf "${jar_file}" | grep -Fxq "${entry}"; then
              echo "Missing ${entry} in ${jar_file}"
              exit 1
            fi
          }

          check_native_jar() {
            local platform="$1"
            local file_name="$2"
            local jar_file="${jar_dir}/bluespice-ngspice-${version}-${platform}.jar"
            check_entry "${jar_file}" "natives/${platform}/${file_name}"
            check_entry "${all_jar}" "natives/${platform}/${file_name}"
          }

          check_native_jar linux-x86_64 libngspice.so
          check_native_jar linux-aarch64 libngspice.so
          check_native_jar windows-x86_64 ngspice.dll
          check_native_jar macos-x86_64 libngspice.dylib
          check_native_jar macos-aarch64 libngspice.dylib
      - name: Publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./gradlew publishAggregationToCentralPortal -PpublishNativeArtifacts=true
